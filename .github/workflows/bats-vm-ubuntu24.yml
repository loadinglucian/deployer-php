name: BATS VM Tests (Ubuntu 24.04)

permissions:
  contents: read
  actions: read

on:
  # TEMP bridge for validating Quality Gates migration before merge.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]

jobs:
  vm-tests-ubuntu24:
    name: vm-tests (ubuntu24)
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'ci/consolidate-quality-gates' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: bats-vm-ubuntu24-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}

      - name: Setup PHP and Composer
        uses: ./.github/actions/setup-php-composer

      - name: Install BATS and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Setup Lima
        uses: lima-vm/lima-actions/setup@v1

      - name: Setup test fixtures
        run: |
          mkdir -p tests/bats/fixtures/keys tests/bats/fixtures/inventory
          ssh-keygen -t ed25519 -f tests/bats/fixtures/keys/id_test -N "" -C "deployer-bats-test"

      - name: Setup environment file
        run: |
          cat <<'EOF' > .env
          ${{ secrets.DOTENV_FILE }}
          EOF

      - name: Run VM tests for ubuntu24
        env:
          CI: "true"
          BATS_DISTRO: ubuntu24
        run: ./bats.sh ci vm ubuntu24
